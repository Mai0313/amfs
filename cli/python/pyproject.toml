[project]
name = "agent-memory-fs"
version = "0.1.0"
description = "Agent Memory File System - a local-first memory store for AI agents, with semantic search."
authors = [
    { name = "Wei Lee", email = "mai@mai0313.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
keywords = ["agent", "memory", "embedding", "semantic-search", "cli", "ai", "llm", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Mai0313/amfs"
Repository = "https://github.com/Mai0313/amfs"
"Bug Tracker" = "https://github.com/Mai0313/amfs/issues"

[project.scripts]
amfs = "amfs:main"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

# The distribution is `agent-memory-fs` because `amfs` was already taken on PyPI,
# but the module and the command it installs stay `amfs`.
[tool.uv.build-backend]
module-name = "amfs"
module-root = "src"
