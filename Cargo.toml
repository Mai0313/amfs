[package]
name = "amfs"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
authors = ["Wei Lee <mai@mai0313.com>"]
description = "Agent Memory File System - a local-first memory store for AI agents, with semantic search."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Mai0313/amfs"
repository = "https://github.com/Mai0313/amfs"
keywords = ["agent", "memory", "embedding", "search", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "amfs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
